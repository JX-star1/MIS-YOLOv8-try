# Ultralytics YOLO 🚀, AGPL-3.0 license
# YOLOv8 object detection model with P2-P4 outputs for small object detection

# Parameters
nc: 80
scales:
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]    # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]   # 1-P2/4
  - [-1, 3, MFE, [128, True]]    # 2
  - [-1, 1, Conv, [256, 3, 2]]   # 3-P3/8
  - [-1, 6, MFE, [256, True]]    # 4
  - [-1, 1, Conv, [512, 3, 2]]   # 5-P4/16
  - [-1, 6, MFE, [512, True]]    # 6
  - [-1, 1, Conv, [1024, 3, 2]]  # 7-P5/32
  - [-1, 3, MFE, [1024, True]]   # 8
  - [-1, 1, SPPF, [1024, 5]]     # 9

head:
  # P5 -> P4
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]     # 10
  - [[-1, 6], 1, Concat, [1]]                      # 11 cat backbone P4
  - [-1, 3, MFE, [512, True]]                      # 12

  # P4 -> P3
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]     # 13
  - [[-1, 4], 1, Concat, [1]]                      # 14 cat backbone P3
  - [-1, 3, MFE, [256, True]]                      # 15 (P3/8)

  # P3 -> P2  新增小目标检测层
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]     # 16
  - [[-1, 2], 1, Concat, [1]]                      # 17 cat backbone P2
  - [-1, 3, MFE, [128, True]]                      # 18 (P2/4-extra small)

  # P2 -> P3
  - [-1, 1, Conv, [128, 3, 2]]                     # 19
  - [[-1, 15], 1, Concat, [1]]                     # 20 cat head P3
  - [-1, 3, MFE, [256, True]]                      # 21 (P3/8-small)

  # P3 -> P4
  - [-1, 1, Conv, [256, 3, 2]]                     # 22
  - [[-1, 12], 1, Concat, [1]]                     # 23 cat head P4
  - [-1, 3, MFE, [512, True]]                      # 24 (P4/16-medium)

  # Detect: P2, P3, P4
  - [[18, 21, 24], 1, Detect, [nc]]