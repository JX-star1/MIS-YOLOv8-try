# Ultralytics YOLO 🚀, AGPL-3.0 license
# YOLOv8n + P2 + PA, Detect(P2, P3, P4), drop P5

# Parameters
nc: 80
scale: n
scales:
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

# YOLOv8.0n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]       # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]      # 1-P2/4
  - [-1, 1, MANet, [128, 1, 3, True, 0.5]]    # 2-P2/4, k=3

  - [-1, 1, Conv, [256, 3, 2]]      # 3-P3/8
   - [-1, 1, MANet, [256, 2, 5, True, 0.5]]    # 4-P3/8, k=5

  - [-1, 1, Conv, [512, 3, 2]]      # 5-P4/16
  - [-1, 1, MANet, [512, 2, 5, True, 0.5]]    # 6-P4/16, k=5

  - [-1, 1, Conv, [1024, 3, 2]]     # 7-P5/32
  - [-1, 1, MANet, [1024, 1, 3, True, 0.5]]   # 8-P5/32, k=3
  - [-1, 1, SPPF, [1024, 5]]        # 9

# YOLOv8n P2-P4 head + PA before Detect
head:
  # P5 -> P4
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 3, C2f, [512]]             # 12, P4/16

  # P4 -> P3
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 3, C2f, [256]]             # 15, P3/8

  # P3 -> P2
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 2], 1, Concat, [1]]
  - [-1, 3, C2f, [128]]             # 18, P2/4

  # P2 -> P3
  - [-1, 1, Conv, [128, 3, 2]]
  - [[-1, 15], 1, Concat, [1]]
  - [-1, 3, C2f, [256]]             # 21, P3/8

  # P3 -> P4
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 12], 1, Concat, [1]]
  - [-1, 3, C2f, [512]]             # 24, P4/16

  # PA before Detect, using P2/P3/P4 only
  - [[18, 21, 24], 1, PAFeature, [0]] # 25, PA-P2
  - [[18, 21, 24], 1, PAFeature, [1]] # 26, PA-P3
  - [[18, 21, 24], 1, PAFeature, [2]] # 27, PA-P4

  # PGD-HeatGate
  # P2: gate=0.5, 用热力图增强特征
  # P3: gate=0.0, 只做辅助监督，不改变特征
  - [25, 1, PGDHeatGate, [128, 4, 0.5, 1.0]] # 28, PGD-P2
  - [26, 1, PGDHeatGate, [256, 8, 0.0, 0.5]] # 29, PGD-P3 aux only

  # Detect(P2, P3, P4), drop P5
  - [[28, 29, 27], 1, Detect, [nc]]