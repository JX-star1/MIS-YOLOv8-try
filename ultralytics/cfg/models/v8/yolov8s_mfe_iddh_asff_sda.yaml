# Ultralytics YOLO 🚀, AGPL-3.0 license
# YOLOv8s + MFE + IDDH-Head + ASFF

nc: 80
scales:
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]    # 0-P1/2
  - [-1, 1, SDA, [128, 2, 3, 3]]    # 1-P2/4,c2=128, scale=2, k=3, r=3
  - [-1, 3, MFE, [128, True]]    # 2
  - [-1, 1, SDA, [256, 2, 3, 3]]    # 3-P3/8,替代原来的 Conv(256, 3, 2)
  - [-1, 6, MFE, [256, True]]    # 4
  - [-1, 1, SDA, [512, 2, 3, 3]]    # 5-P4/16,替代原来的 Conv(512, 3, 2)
  - [-1, 6, MFE, [512, True]]    # 6
  - [-1, 1, SDA, [1024, 2, 3, 3]]   # 7-P5/32,替代原来的 Conv(1024, 3, 2)
  - [-1, 3, MFE, [1024, True]]   # 8
  - [-1, 1, SPPF, [1024, 5]]     # 9

head:
  # top-down
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]     # 10
  - [[-1, 6], 1, Concat, [1]]                      # 11
  - [-1, 3, MFE, [512, True]]                      # 12

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]     # 13
  - [[-1, 4], 1, Concat, [1]]                      # 14
  - [-1, 3, MFE, [256, True]]                      # 15 P3

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]     # 16
  - [[-1, 2], 1, Concat, [1]]                      # 17
  - [-1, 3, MFE, [128, True]]                      # 18 P2

  # bottom-up
  - [-1, 1, Conv, [128, 3, 2]]                     # 19
  - [[-1, 15], 1, Concat, [1]]                     # 20
  - [-1, 3, MFE, [256, True]]                      # 21 P3

  - [-1, 1, Conv, [256, 3, 2]]                     # 22
  - [[-1, 12], 1, Concat, [1]]                     # 23
  - [-1, 3, MFE, [512, True]]                      # 24 P4

  # ASFF fusion for P2/P3/P4
  - [[18, 21, 24], 1, ASFF, [128, 0]]              # 25 fused P2
  - [[18, 21, 24], 1, ASFF, [256, 1]]              # 26 fused P3
  - [[18, 21, 24], 1, ASFF, [512, 2]]              # 27 fused P4

  - [[25, 26, 27], 1, Detect, [nc]]